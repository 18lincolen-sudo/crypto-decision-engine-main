# ⚠️ This blueprint may not be what actually runs. Verify before trusting it.
#
# The live worker answers at crypto-decision-engine-main-hev8.onrender.com.
# Render derives that hostname from the SERVICE name, and the name below is
# `crypto-trading-worker` — the hostname instead matches the REPO name, which
# is what Render fills in when a service is created by hand from a repo. So the
# running service was most likely NOT created from this file, in which case
# nothing here applies: not buildCommand, not startCommand, and not
# `autoDeploy: true` — which would explain a push to `main` that never
# redeployed.
#
# ARCHITECTURE.md §5.1 documents a THIRD variant (Root Directory `server`,
# startCommand `node dist/worker.js`). At most one of the three is real.
#
# Do NOT "tidy" the name below to match the hostname before checking the Render
# dashboard. Render identifies a blueprint-managed service BY this name:
# changing it on a service that IS managed here makes Render treat it as a new
# service, orphaning the running one and killing the hostname that is baked
# into VITE_TRADING_API_URL at build time.
services:
  - type: web
    name: crypto-trading-worker
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix server install && npm --prefix server run build
    startCommand: node server/dist/worker.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: BYBIT_API_KEY
        sync: false
      - key: BYBIT_SECRET_KEY
        sync: false
      - key: BOT_ADMIN_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: BYBIT_TESTNET
        value: "false"
      - key: BOT_DRY_RUN
        value: "true"
      - key: BOT_AUTOSTART
        value: "false"
      - key: BOT_RISK_LEVEL
        value: "medium"
      - key: BOT_SYMBOLS
        value: "100"
      - key: BOT_MIN_CONFIDENCE
        value: "60"
      - key: BOT_POSITION_PERCENT
        value: "10"
      - key: BOT_MAX_OPEN_POSITIONS
        value: "7"
      - key: BOT_MAX_FUTURES_POSITIONS
        value: "2"
      - key: BOT_SCAN_CONCURRENCY
        value: "5"
      - key: BOT_SCAN_INTERVAL_SECONDS
        value: "300"
      - key: BOT_KLINE_INTERVAL
        value: "240"
      - key: BOT_RATE_LIMIT_MAX
        value: "300"
      - key: BOT_RATE_LIMIT_WINDOW_MS
        value: "120000"
      - key: BOT_REQUEST_TIMEOUT_MS
        value: "15000"
      - key: CORS_ORIGIN
        # Explicit frontend origins only; no wildcard. Keep local origins for
        # browser testing and the production Netlify origin for deployment.
        value: "https://crypto-d.netlify.app,http://localhost:8080,http://localhost:5173"
      - key: PORT
        value: "3001"

