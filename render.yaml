services:
  - type: web
    name: crypto-trading-worker
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/worker.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: BYBIT_API_KEY
        sync: false
      - key: BYBIT_SECRET_KEY
        sync: false
      - key: BOT_ADMIN_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: BYBIT_TESTNET
        value: "false"
      - key: BOT_DRY_RUN
        value: "true"
      - key: BOT_AUTOSTART
        value: "false"
      - key: BOT_RISK_LEVEL
        value: "medium"
      - key: BOT_SYMBOLS
        value: "100"
      - key: BOT_MIN_CONFIDENCE
        value: "60"
      - key: BOT_POSITION_PERCENT
        value: "10"
      - key: BOT_MAX_OPEN_POSITIONS
        value: "7"
      - key: BOT_MAX_FUTURES_POSITIONS
        value: "2"
      - key: BOT_SCAN_CONCURRENCY
        value: "5"
      - key: BOT_SCAN_INTERVAL_SECONDS
        value: "300"
      - key: BOT_KLINE_INTERVAL
        value: "240"
      - key: BOT_RATE_LIMIT_MAX
        value: "300"
      - key: BOT_RATE_LIMIT_WINDOW_MS
        value: "120000"
      - key: BOT_REQUEST_TIMEOUT_MS
        value: "15000"
      - key: CORS_ORIGIN
        # Restricted to the Netlify frontend origin. No wildcard.
        value: "https://crypto-d.netlify.app"
      - key: PORT
        value: "3001"

